<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FX_VISION.AI | Advanced Forex Analysis</title>
    <!-- Tailwind CSS CDN for structure -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for sleek tech styling -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body class="text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Glowing Top Accent Bar -->
    <div class="h-1 bg-gradient-to-r from-cyan-500 via-violet-500 to-fuchsia-500 w-full"></div>

    <!-- Header Navbar -->
    <header class="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md px-6 py-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="h-8 w-8 rounded-lg bg-gradient-to-br from-violet-500 to-fuchsia-500 flex items-center justify-center font-bold text-white shadow-lg shadow-violet-500/20">👁️</div>
                <span class="text-2xl font-black bg-gradient-to-r from-violet-400 via-fuchsia-400 to-cyan-400 bg-clip-text text-transparent tracking-tight">FX_VISION<span class="text-xs font-mono font-medium text-slate-500 ml-1">.AI</span></span>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-semibold flex items-center gap-1.5 backdrop-blur-sm">
                    <span class="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span> SYSTEM ONLINE
                </span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 p-6 max-w-7xl mx-auto w-full">
        
        <!-- Left Column: Input and Parameters -->
        <section class="lg:col-span-1 flex flex-col gap-6">
            
            <!-- Colorful Dropzone Card -->
            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 relative overflow-hidden backdrop-blur-sm group flex flex-col justify-between min-h-[320px]">
                <div class="absolute -top-24 -left-24 h-48 w-48 bg-violet-600/10 rounded-full blur-3xl pointer-events-none group-hover:bg-violet-600/20 transition-all duration-500"></div>
                <div class="absolute -bottom-24 -right-24 h-48 w-48 bg-cyan-600/10 rounded-full blur-3xl pointer-events-none group-hover:bg-cyan-600/20 transition-all duration-500"></div>
                
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 z-10 flex items-center gap-2">
                    <span class="p-1 rounded bg-slate-800 text-slate-300">01</span> Visual Chart Data
                </h3>

                <!-- Upload Drag Area -->
                <div id="dropzone" class="flex-1 border-2 border-dashed border-slate-700/60 hover:border-violet-500/50 rounded-xl flex flex-col items-center justify-center p-6 transition-all duration-300 relative group/drop bg-slate-950/40 cursor-pointer">
                    <input type="file" id="chartUpload" class="absolute inset-0 opacity-0 cursor-pointer z-20" accept="image/*" />
                    
                    <div id="uploadPrompt" class="text-center pointer-events-none transition-all duration-300">
                        <div class="mx-auto h-14 w-14 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center mb-4 group-hover/drop:scale-110 group-hover/drop:border-violet-500/30 group-hover/drop:bg-violet-950/20 text-2xl transition-all duration-300">📸</div>
                        <p class="font-bold text-slate-200 group-hover/drop:text-violet-400 transition-colors">Upload Chart Image</p>
                        <p class="text-xs text-slate-500 mt-1 max-w-[200px] mx-auto">Drop screenshot, tap to browse, or paste image directly</p>
                    </div>

                    <!-- Hidden Image Preview Wrapper -->
                    <div id="previewContainer" class="hidden absolute inset-2 rounded-lg overflow-hidden bg-slate-950 flex items-center justify-center z-10 border border-slate-800">
                        <img id="imagePreview" src="" alt="Forex Chart Preview" class="w-full h-full object-cover">
                        <button id="removeImageBtn" class="absolute top-2 right-2 bg-slate-950/80 hover:bg-rose-950/90 text-slate-400 hover:text-rose-400 border border-slate-800 p-2 rounded-lg text-xs font-bold transition-all z-30 backdrop-blur-sm">✕ Remove</button>
                    </div>
                </div>
            </div>

            <!-- Parameters Card -->
            <div class="bg-slate-900/40 border border-slate-800 rounded-2xl p-6 relative overflow-hidden backdrop-blur-sm">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <span class="p-1 rounded bg-slate-800 text-slate-300">02</span> Router Environment
                </h3>
                
                <!-- Broker Selection with dynamic neon accent markers -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-slate-400 mb-2">TARGET LIQUIDITY PROVIDER (BROKER)</label>
                    <div class="relative">
                        <select id="brokerSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-200 focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500 appearance-none font-medium cursor-pointer transition-all">
                            <option value="exness">Exness — ECN Ultra-Low Spread</option>
                            <option value="avatrade">AvaTrade — Dedicated Fixed Spread</option>
                            <option value="xm">XM Global — Standard execution</option>
                            <option value="pepperstone">Pepperstone — Razor Raw Liquidity</option>
                            <option value="icmarkets">IC Markets — True ECN Server</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">▼</div>
                    </div>
                </div>

                <!-- Risk Profiles -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-2">RISK EVALUATION COEFFICIENT</label>
                    <div class="grid grid-cols-3 gap-2" id="riskButtonGroup">
                        <button type="button" data-risk="conservative" class="risk-btn border border-slate-800 bg-slate-950/60 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:border-slate-700 transition-all">Conservative</button>
                        <button type="button" data-risk="moderate" class="risk-btn border-2 border-violet-500 bg-violet-600/10 py-2.5 rounded-xl text-xs font-bold text-violet-400 glow-active transition-all">Moderate</button>
                        <button type="button" data-risk="aggressive" class="risk-btn border border-slate-800 bg-slate-950/60 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:border-slate-700 transition-all">Aggressive</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Column: AI Analytical Terminal Dashboard -->
        <section class="lg:col-span-2 bg-slate-900/40 border border-slate-800 rounded-2xl p-6 flex flex-col min-h-[500px] backdrop-blur-sm relative overflow-hidden">
            
            <div class="border-b border-slate-800/80 pb-4 mb-5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span id="terminalPulse" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-500 opacity-75"></span>
                        <span id="terminalDot" class="relative inline-flex rounded-full h-2 w-2 bg-slate-500"></span>
                    </span>
                    <h2 class="font-bold text-lg text-slate-100 flex items-center gap-2">AI Structural Analysis Core</h2>
                </div>
                <!-- Dynamic Header Output -->
                <div class="flex gap-2 items-center">
                    <span id="detectedPair" class="text-xs bg-slate-950 border border-slate-800 text-slate-400 font-mono px-3 py-1.5 rounded-lg tracking-wider font-semibold">PAIR: UNDEFINED</span>
                    <span id="detectedTimeframe" class="text-xs bg-slate-950 border border-slate-800 text-slate-400 font-mono px-3 py-1.5 rounded-lg font-semibold">TF: --</span>
                </div>
            </div>

            <!-- Quantitative Output Matrix Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <!-- Direction block -->
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl relative overflow-hidden transition-all duration-300" id="directionCard">
                    <span class="text-xs text-slate-500 block font-bold tracking-wider uppercase mb-1">DIRECTIONAL MATRIX</span>
                    <span id="outputDirection" class="text-xl font-black text-slate-400 tracking-wide uppercase transition-all duration-300">AWAITING SCAN</span>
                </div>
                <!-- Entry level block -->
                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl transition-all duration-300" id="entryCard">
                    <span class="text-xs text-slate-500 block font-bold tracking-wider uppercase mb-1">OPTIMAL ENTRY VALUE</span>
http://localhost:3002
